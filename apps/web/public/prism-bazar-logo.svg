<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" fill="none">
  <!-- Prism / Diamond Geometric Base -->
  <polygon points="30,8 52,24 44,48 16,48 8,24" fill="#ca8a04" opacity="0.15" />
  <polygon points="30,8 52,24 44,48 30,52 16,48 8,24" stroke="#ca8a04" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
  
  <!-- Stylized Green Leaf (Organic) -->
  <path d="M30,10 C42,16 48,28 42,42 C36,48 24,46 22,34 C20,24 24,14 30,10 Z" fill="#16a34a"/>
  <!-- Leaf Vein & Book Pages (Education) -->
  <path d="M26,38 C28,28 32,20 36,14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M29,32 C34,30 38,32 40,36" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M28,24 C32,22 35,24 37,27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Open Book Silhouette at base -->
  <path d="M18,44 Q30,40 42,44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M30,40 L30,48" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Brand Typography (Clean with space between Prism and Bazar) -->
  <text x="66" y="39" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="28" font-weight="800" fill="#15803d" letter-spacing="-0.5">
    Prism<tspan dx="9" fill="#ca8a04">Bazar</tspan>
  </text>
</svg>
